name: Build installers

# Every push to main builds Faderhouse for macOS and Windows and uploads the installers as
# artifacts (Actions tab > latest run > Artifacts). When CMakeLists.txt has a version that
# has no release yet, the run also publishes release vX.Y.Z with both platforms' installers
# and one SHA256SUMS.txt (the in-app updater reads it).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out version and whether to publish a release
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^project(Faderhouse VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
              echo "Tag ${GITHUB_REF_NAME} doesn't match CMakeLists.txt version $APP_VERSION"; exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$APP_VERSION" >/dev/null; then
            # New version number on main and no release for it yet: publish one.
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: ./build.sh Release --no-open

      - name: Make installers
        run: |
          python3 -m pip install --user --break-system-packages dmgbuild || python3 -m pip install --user dmgbuild
          ./package.sh

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Faderhouse-macOS
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Download the Steinberg ASIO SDK
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca") { throw "ASIO SDK checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "asiosdk"
          Expand-Archive $zip -DestinationPath $dir -Force
          $header = Get-ChildItem $dir -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $header) { throw "iasiodrv.h not found in the ASIO SDK" }
          $sdk = $header.Directory.Parent.FullName
          Write-Host "ASIO SDK: $sdk"
          "ASIO_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download VB-CABLE (Mic FX on Windows, VB-Audio donationware)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "vbcable.zip"
          $ok = $false
          foreach ($n in 46, 45, 44, 43) {
            $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack$n.zip"
            try { Invoke-WebRequest -Uri $url -OutFile $zip -ErrorAction Stop; Write-Host "Got $url"; $ok = $true; break } catch { Write-Host "Not at $url" }
          }
          if (-not $ok) { throw "Could not download the VB-CABLE driver pack" }
          $dir = Join-Path $env:RUNNER_TEMP "vbcable"
          Expand-Archive $zip -DestinationPath $dir -Force
          $setup = Get-ChildItem $dir -Recurse -Filter VBCABLE_Setup_x64.exe | Select-Object -First 1
          if (-not $setup) { throw "VBCABLE_Setup_x64.exe not found in the driver pack" }
          # Only ship it if VB-Audio's own signature on the installer checks out.
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "VB-CABLE installer signature is not valid: $($sig.Status)" }
          "CABLE_DIR=$($setup.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DFADERHOUSE_ASIO_SDK_DIR="$env:ASIO_SDK_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          }
          $isccPath = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $exe = Resolve-Path "build\Faderhouse_artefacts\Release\Faderhouse.exe"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          & $isccPath "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceExe=$exe" "/DOutputDir=$dist" "/DCableDir=$env:CABLE_DIR" installer\windows\Faderhouse.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $dist

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Faderhouse-Windows
          path: dist/*-Setup.exe
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum Faderhouse-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Faderhouse ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Installer |
            |---|---|
            | **macOS** 14.2+ (Apple Silicon) | `Faderhouse-${{ needs.version.outputs.version }}.pkg` (recommended) or `.dmg` |
            | **Windows** 11 (64-bit) | `Faderhouse-${{ needs.version.outputs.version }}-Setup.exe` |

            See the [README](https://github.com/TibaGH/faderhouse#installing) for setup.
