name: Build installers

# Every push to main builds Faderhouse for macOS and Windows and uploads the installers as
# artifacts (Actions tab > latest run > Artifacts). When CMakeLists.txt has a version that
# has no release yet, the run also publishes release vX.Y.Z with both platforms' installers
# and one SHA256SUMS.txt (the in-app updater reads it).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out version and whether to publish a release
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^project(Faderhouse VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
              echo "Tag ${GITHUB_REF_NAME} doesn't match CMakeLists.txt version $APP_VERSION"; exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$APP_VERSION" >/dev/null; then
            # New version number on main and no release for it yet: publish one.
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    # Intel runner that builds for Apple Silicon: GitHub's Apple Silicon runners are often full.
    runs-on: macos-26-intel
    timeout-minutes: 150
    env:
      # Signing + notarization run only when the repo has the Apple secrets
      # (MACOS_CERTIFICATE_P12 etc., see README "Building"). Without them: ad-hoc build as before.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: ./build.sh Release --no-open

      - name: Build the voice plugins (VST3, go into the .pkg)
        run: |
          cmake -S Plugins -B build-plugins -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-plugins --config Release --parallel "$(sysctl -n hw.ncpu)"
          for p in build-plugins/*_artefacts/Release/VST3/*.vst3; do codesign --force --deep -s - "$p"; done

      - name: Import the Developer ID certificates
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's Developer ID intermediate certificate, so the chain is complete on the runner.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "Identities in the signing keychain:"
          security find-identity -v "$KEYCHAIN"
          identity() {  # full certificate name, e.g. Developer ID Application: Tim Balogh (TEAMID)
            security find-identity -v "$KEYCHAIN" | grep "$1: .*($TEAM_ID)\"" | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/'
          }
          SIGN_APP="$(identity "Developer ID Application")"
          SIGN_INSTALLER="$(identity "Developer ID Installer")"
          [ -n "$SIGN_APP" ] || { echo "::error::No 'Developer ID Application' certificate for team $TEAM_ID in the .p12"; exit 1; }
          [ -n "$SIGN_INSTALLER" ] || { echo "::error::No 'Developer ID Installer' certificate for team $TEAM_ID in the .p12"; exit 1; }
          echo "App identity:       $SIGN_APP"
          echo "Installer identity: $SIGN_INSTALLER"

          {
            echo "FADERHOUSE_KEYCHAIN=$KEYCHAIN"
            echo "FADERHOUSE_SIGN_APP=$SIGN_APP"
            echo "FADERHOUSE_SIGN_INSTALLER=$SIGN_INSTALLER"
          } >> "$GITHUB_ENV"

      - name: Make installers
        run: |
          python3 -m pip install --user --break-system-packages dmgbuild || python3 -m pip install --user dmgbuild
          ./package.sh

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")

          for f in dist/*.pkg dist/*.dmg; do
            echo "==> Notarizing $f"
            xcrun notarytool submit "$f" "${AUTH[@]}" --wait --timeout 1h --output-format json | tee "$RUNNER_TEMP/notary.json"
            STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$RUNNER_TEMP/notary.json")
            ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$RUNNER_TEMP/notary.json")
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization of $f: $STATUS"
              [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}"
              exit 1
            fi
            [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true   # lists warnings, if any

            # The ticket can take a moment to become available to stapler.
            for attempt in 1 2 3 4 5; do
              xcrun stapler staple "$f" && break
              [ "$attempt" = 5 ] && { echo "::error::Stapling $f failed"; exit 1; }
              echo "Stapling not possible yet, retrying in 30 s"; sleep 30
            done
            xcrun stapler validate "$f"
          done
          rm -f "$KEY"

          echo "==> Gatekeeper check"
          for f in dist/*.pkg; do spctl --assess --type install -vv "$f"; done
          for f in dist/*.dmg; do spctl --assess --type open --context context:primary-signature -vv "$f"; done

      - name: Remove the signing keychain
        if: always() && env.FADERHOUSE_KEYCHAIN != ''
        run: security delete-keychain "$FADERHOUSE_KEYCHAIN" || true

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Faderhouse-macOS
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Download the Steinberg ASIO SDK
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca") { throw "ASIO SDK checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "asiosdk"
          Expand-Archive $zip -DestinationPath $dir -Force
          $header = Get-ChildItem $dir -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $header) { throw "iasiodrv.h not found in the ASIO SDK" }
          $sdk = $header.Directory.Parent.FullName
          Write-Host "ASIO SDK: $sdk"
          "ASIO_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download VB-CABLE (Mic FX on Windows, VB-Audio donationware)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "vbcable.zip"
          $ok = $false
          foreach ($n in 46, 45, 44, 43) {
            $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack$n.zip"
            try { Invoke-WebRequest -Uri $url -OutFile $zip -ErrorAction Stop; Write-Host "Got $url"; $ok = $true; break } catch { Write-Host "Not at $url" }
          }
          if (-not $ok) { throw "Could not download the VB-CABLE driver pack" }
          $dir = Join-Path $env:RUNNER_TEMP "vbcable"
          Expand-Archive $zip -DestinationPath $dir -Force
          $setup = Get-ChildItem $dir -Recurse -Filter VBCABLE_Setup_x64.exe | Select-Object -First 1
          if (-not $setup) { throw "VBCABLE_Setup_x64.exe not found in the driver pack" }
          # Only ship it if VB-Audio's own signature on the installer checks out.
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "VB-CABLE installer signature is not valid: $($sig.Status)" }
          "CABLE_DIR=$($setup.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DFADERHOUSE_ASIO_SDK_DIR="$env:ASIO_SDK_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the voice plugins (VST3, go into the installer)
        shell: pwsh
        run: |
          cmake -S Plugins -B build-plugins -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-plugins --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force plugins-out | Out-Null
          Get-ChildItem build-plugins -Recurse -Directory -Filter *.vst3 | Where-Object { $_.FullName -match "Release\\VST3\\[^\\]+\.vst3$" } | ForEach-Object { Copy-Item $_.FullName plugins-out -Recurse -Force }
          Get-ChildItem plugins-out
          "PLUGINS_DIR=$((Resolve-Path plugins-out).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          }
          $isccPath = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $exe = Resolve-Path "build\Faderhouse_artefacts\Release\Faderhouse.exe"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          & $isccPath "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceExe=$exe" "/DOutputDir=$dist" "/DCableDir=$env:CABLE_DIR" "/DPluginsDir=$env:PLUGINS_DIR" installer\windows\Faderhouse.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $dist

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Faderhouse-Windows
          path: dist/*-Setup.exe
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum Faderhouse-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Faderhouse ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Installer |
            |---|---|
            | **macOS** 14.2+ (Apple Silicon) | `Faderhouse-${{ needs.version.outputs.version }}.pkg` (recommended) or `.dmg` |
            | **Windows** 11 (64-bit) | `Faderhouse-${{ needs.version.outputs.version }}-Setup.exe` |

            See the [README](https://github.com/TibaGH/faderhouse#installing) for setup.
