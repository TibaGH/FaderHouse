name: Build macOS installers

# Every push to main builds Faderhouse and uploads the .pkg and .dmg as artifacts
# (Actions tab > latest run > Artifacts). When CMakeLists.txt has a version that has
# no release yet, the run also publishes release vX.Y.Z (the in-app updater reads it).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Work out version and whether to publish a release
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^project(Faderhouse VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
              echo "Tag ${GITHUB_REF_NAME} doesn't match CMakeLists.txt version $APP_VERSION"; exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$APP_VERSION" >/dev/null; then
            # New version number on main and no release for it yet: publish one.
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./build.sh Release --no-open

      - name: Make installers
        run: |
          python3 -m pip install --user --break-system-packages dmgbuild || python3 -m pip install --user dmgbuild
          ./package.sh

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Faderhouse-macOS
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Faderhouse ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
